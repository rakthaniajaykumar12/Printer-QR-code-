services:
  # Smart Xerox Full-Stack Service (FastAPI serves built React frontend + API)
  - type: web
    name: smart-xerox
    env: python
    region: singapore # Closest low-latency region to India
    plan: free
    buildCommand: |
      # 1. Install frontend dependencies and build production React bundle
      cd frontend && npm install && npm run build && cd ..
      # 2. Install backend Python dependencies
      pip install -r backend/requirements.txt
    startCommand: cd backend && python run.py
    envVars:
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: SHOP_NAME
        value: Smart Xerox
      - key: SHOP_TAGLINE
        value: Fast Mobile Printing • Epson EcoTank L3250
      - key: SECRET_KEY
        generateValue: true
      - key: OWNER_USERNAME
        value: admin
      - key: OWNER_PASSWORD
        value: ChangeMeAfterFirstLogin!
      - key: RATE_BW_PER_PAGE
        value: "2.0"
      - key: RATE_COLOR_PER_PAGE
        value: "10.0"
      - key: FILE_RETENTION_HOURS
        value: "24"
      - key: CORS_ORIGINS
        value: "*"
